<!--
  Corridor mark (canonical).

  A one-point-perspective passage: a near wall, a far wall, and a single sightline
  joining them. Reads as an abstract corridor and, at a glance, as a route on a map.

  Geometry is identical to `components/Mark.tsx` and to the phase 1 identity spec
  (`corridor-identity.html`). If it changes, it changes in the identity spec first.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" role="img" aria-label="Corridor">
  <title>Corridor</title>
  <!-- near wall -->
  <line x1="30" y1="20" x2="30" y2="80" stroke="#C9A35C" stroke-width="4" stroke-linecap="round"/>
  <!-- far wall -->
  <line x1="66" y1="32" x2="66" y2="68" stroke="#C9A35C" stroke-width="4" stroke-linecap="round"/>
  <!-- the sightline -->
  <line x1="30" y1="80" x2="66" y2="32" stroke="#E0BC7C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- arrival -->
  <circle cx="66" cy="32" r="3.5" fill="#E0BC7C"/>
</svg>
