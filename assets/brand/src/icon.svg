<!--
  App icon source: iOS / store listing. 1024×1024, full bleed, no transparency
  (iOS rejects an alpha channel and masks the corners itself, so nothing lives there).

  The mark is the hero form, dot included: at icon size the dot is the only thing that
  says *arrival* rather than just *passage*. Geometry is the canonical 100-unit mark
  scaled ×8.667 and centred on its bounding box.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <rect width="1024" height="1024" fill="#14120F"/>
  <g transform="translate(96, 78.667) scale(8.667)">
    <line x1="30" y1="20" x2="30" y2="80" stroke="#C9A35C" stroke-width="4" stroke-linecap="round"/>
    <line x1="66" y1="32" x2="66" y2="68" stroke="#C9A35C" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="80" x2="66" y2="32" stroke="#E0BC7C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="66" cy="32" r="3.5" fill="#E0BC7C"/>
  </g>
</svg>
