<!--
  Favicon source, drawn at its real size rather than downscaled from the 1024 icon.

  Two deliberate departures from the canonical mark, both because 48px is not 1024px:
  the arrival dot is dropped (it lands at under 2px and reads as a compression
  artefact), and the walls are drawn at 5.5 units instead of 4 to hold their weight
  once rasterised. This is the standard optical-size correction, not a different mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" fill="#14120F"/>
  <g transform="translate(1.6, 0.667) scale(0.4667)">
    <line x1="30" y1="20" x2="30" y2="80" stroke="#C9A35C" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="66" y1="32" x2="66" y2="68" stroke="#C9A35C" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="30" y1="80" x2="66" y2="32" stroke="#E0BC7C" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
