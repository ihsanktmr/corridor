appId: host.exp.Exponent
name: Capture the portfolio screens in flow order
---
# Expo Go is the container in development. A cold open of the Metro URL starts at
# the root route without clearing the simulator itself.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible: Your dollars, still dollars, on the other side.
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
# Expo Go 57 enables a floating Tools button after each cold start. Turn that
# container chrome off before taking product screenshots.
- tapOn:
    point: 85%, 9%
- scroll
- tapOn:
    point: 337, 585
- assertVisible: Your dollars, still dollars, on the other side.
- takeScreenshot: 01-welcome

- tapOn: you@email.com
- inputText: reviewer@corridor.dev
- tapOn: Continue
- extendedWaitUntil:
    visible: Send to Türkiye
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-home

- tapOn: Send to Türkiye
- extendedWaitUntil:
    visible: New transfer
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-amount

- tapOn: Continue
- extendedWaitUntil:
    visible: Add USD
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-add-usd

- tapOn: Pay $503.75
- extendedWaitUntil:
    visible: One check before your first payout.
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-kyc-gate

- tapOn: Start verification
- extendedWaitUntil:
    visible: Front of your licence
    timeout: 5000
- tapOn: Capture
- assertVisible: Back of your licence
- takeScreenshot: 06-id-capture

- tapOn: Capture
- assertVisible: Now a selfie
- tapOn: Capture and submit
- extendedWaitUntil:
    visible: Who's receiving the ₺26,420.00?
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-recipient

- tapOn: Continue
- extendedWaitUntil:
    visible: Review
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-review

- openLink: ${METRO_URL}/--/demo/inflight
- extendedWaitUntil:
    visible: Sending on Base
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-in-flight

- openLink: ${METRO_URL}/--/demo/receipt
- extendedWaitUntil:
    visible: delivered
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10-receipt

- openLink: ${METRO_URL}/--/demo/expired
- extendedWaitUntil:
    visible: Your rate expired
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11a-rate-expired

- openLink: ${METRO_URL}/--/demo/returned
- extendedWaitUntil:
    visible: Garanti BBVA sent it back
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11c-payout-returned

- openLink: ${METRO_URL}/--/demo/kyc-resubmit
- extendedWaitUntil:
    visible: We need one photo again
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11b-kyc-resubmit
